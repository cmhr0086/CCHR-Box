name: Oss Source Checks
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    name: Compile and test (no distribution)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: actions/setup-go@v5
        with:
          go-version: ^1.25
      - name: Prepare Android toolchain
        run: sdkmanager "platforms;android-35" "build-tools;35.0.1" "ndk;25.0.8775105"
      - name: Build native core
        run: ./run lib core
      - name: Prepare assets
        run: ./run init action gradle
      - name: Test build configuration
        run: ./gradlew -p buildSrc test
      - name: Compile and test public client
        env:
          BUILD_PLUGIN: none
        run: |
          ./gradlew app:assembleOssDebug app:testOssDebugUnitTest \
            -PCCHR_SUBSCRIPTION_ENDPOINT= \
            -PCCHR_ANNOUNCEMENT_ENDPOINT= \
            -PCCHR_APP_CONTROL_ENDPOINT=
